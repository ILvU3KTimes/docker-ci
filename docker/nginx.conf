# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    server_name gtapi.tagtjn.cn www.gtapi.tagtjn.cn;
    
    # 重定向所有 HTTP 请求到 HTTPS
    return 301 https://$server_name$request_uri;
}

# HTTPS 服务器
server {
    listen 443 ssl;
    http2 on;
    server_name gtapi.tagtjn.cn www.gtapi.tagtjn.cn;

    # 文件上传配置 ====================
    # 全局客户端请求体大小限制(现在设置为512M）
    client_max_body_size 512M;
    
    # 客户端请求体缓冲区大小
    client_body_buffer_size 128k;
    
    # 客户端请求超时设置（大文件需要更长时间）
    client_body_timeout 300s;
    client_header_timeout 300s;
    
    # 代理超时设置
    proxy_connect_timeout 300s;
    proxy_send_timeout 300s;
    proxy_read_timeout 300s;

    # 使用 PEM 格式证书（推荐）
    ssl_certificate /etc/nginx/ssl/_.tagtjn.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/_.tagtjn.cn.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache builtin:1000 shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets on;
    ssl_buffer_size 4k;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 原有配置保持不变
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== FLV 流代理配置 ====================
    location /nvr1/ {
        # 代理到HTTP后端，但对外提供HTTPS
        proxy_pass http://58.56.223.174:18080/nvr1/;

        # 流媒体关键优化
        proxy_buffering off;
        proxy_cache off;
        
        # 禁用SSL对特定路径的某些特性
        proxy_ssl_server_name on;
        
        # 优化代理头
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 关键：调整缓冲区和大文件传输
        proxy_max_temp_file_size 0;  # 禁用临时文件
        proxy_http_version 1.1;      # 使用HTTP/1.1保持连接
        
        # 连接优化
        proxy_connect_timeout 30s;
        proxy_send_timeout 3600s;    # 长超时
        proxy_read_timeout 3600s;
        
        # 禁用gzip压缩（流媒体不需要）
        proxy_set_header Accept-Encoding "";
        
        # CORS配置保持不变
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Origin, Accept";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        
        # Range请求处理
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range $http_if_range;
    }

    # 代理 aiVideo 图片
    location /aiVideo/img/ {
        proxy_pass http://58.56.223.174:28081/aiVideo/img/;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, OPTIONS";
    }

    # 代理 aiVideo 视频
    location /aiVideo/videos/ {
        proxy_pass http://58.56.223.174:28081/aiVideo/videos/;

        # 视频流媒体配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # CORS for video
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Headers "Range, Origin";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";

        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range $http_if_range;
    }

    # API 代理
    location /api {
        rewrite /api(/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # daihai 路径代理
    location /daihai {
        rewrite /daihai(/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理：处理 /daihai/ws 开头的连接
    location /daihai/ws {
        rewrite /daihai(/ws/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;

        # WebSocket 配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # # 静态资源缓存优化
    # location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
    #     expires 1y;
    #     add_header Cache-Control "public, immutable";
    #     add_header Vary Accept-Encoding;
    #     access_log off;
    # }
    
    # # 视频文件缓存配置（单独处理视频文件）
    # location ~* \.(flv|mp4|m3u8|ts)$ {
    #     # 代理到 FLV 流服务器
    #     proxy_pass http://58.56.223.174:18080;
        
    #     # 流媒体优化配置
    #     proxy_buffering off;
    #     proxy_cache off;
    #     proxy_read_timeout 3600s;
        
    #     # CORS 支持
    #     add_header Access-Control-Allow-Origin "*";
    #     add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
    #     add_header Access-Control-Allow-Headers "Range, Origin, Accept";
    #     add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        
    #     # 视频文件缓存策略（短期缓存）
    #     expires 1h;
    #     add_header Cache-Control "public, max-age=3600";
    # }

    # 文本文件访问配置
    location /8g15wtzAOE.txt {
        alias /etc/nginx/ssl/8g15wtzAOE.txt;
        # 或者使用root
        # root /etc/nginx/ssl/;
        
        # 设置正确的MIME类型
        default_type text/plain;
        
        # 可选：添加缓存头
        expires 1h;
        
        # 可选：安全设置
        add_header X-Content-Type-Options nosniff;
    }
}