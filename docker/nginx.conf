# HTTP 服务器 - 重定向到 HTTPS
server {
    listen 80;
    server_name gtapi.tagtjn.cn www.gtapi.tagtjn.cn;
    
    # 重定向所有 HTTP 请求到 HTTPS
    return 301 https://$server_name$request_uri;
}

