# HTTPS 服务器
server {
    listen 443 ssl;
    http2 on;
    server_name gtapi.tagtjn.cn www.gtapi.tagtjn.cn;

    # 使用 PEM 格式证书（推荐）
    ssl_certificate /etc/nginx/ssl/_.tagtjn.cn.pem;
    ssl_certificate_key /etc/nginx/ssl/_.tagtjn.cn.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000" always;
    add_header X-Content-Type-Options nosniff;
    add_header X-Frame-Options SAMEORIGIN;

    # 原有配置保持不变
    root /usr/share/nginx/html;
    index index.html index.htm;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # ==================== FLV 流代理配置 ====================
    location /nvr1/ {
        # 代理到HTTP后端，但对外提供HTTPS
        proxy_pass http://58.56.223.174:18080/nvr1/;
        
        # 代理头设置
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # 流媒体优化
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        
        # CORS跨域支持
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Origin, Accept";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        
        # 处理Range请求（视频拖拽）
        proxy_set_header Range $http_range;
        proxy_set_header If-Range $http_if_range;
        proxy_no_cache $http_range $http_if_range;
    }

    # API 代理
    location /api {
        rewrite /api(/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # daihai 路径代理
    location /daihai {
        rewrite /daihai(/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # WebSocket 代理：处理 /daihai/ws 开头的连接
    location /daihai/ws {
        rewrite /daihai(/ws/.*) $1 break;
        proxy_pass http://58.56.223.174:28081;

        # WebSocket 配置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    # 静态资源缓存优化
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary Accept-Encoding;
        access_log off;
    }
    
    # 视频文件缓存配置（单独处理视频文件）
    location ~* \.(flv|mp4|m3u8|ts)$ {
        # 代理到 FLV 流服务器
        proxy_pass http://58.56.223.174:18080;
        
        # 流媒体优化配置
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        
        # CORS 支持
        add_header Access-Control-Allow-Origin "*";
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS";
        add_header Access-Control-Allow-Headers "Range, Origin, Accept";
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range";
        
        # 视频文件缓存策略（短期缓存）
        expires 1h;
        add_header Cache-Control "public, max-age=3600";
    }
}